<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Portal Ujian</title>
    <style>
        /* Reset & Base Styling */
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2, h3 { text-align: center; color: #333; margin-top: 0; }

        /* Top Nav Menu / Theme Button Bar */
        .top-nav {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        .theme-menu-btn {
            background: #6f42c1;
            color: white;
            width: auto;
            padding: 8px 16px;
            font-size: 13px;
            margin-top: 0;
        }
        .theme-menu-btn:hover { background: #5a32a3; }

        /* Form Layout */
        .form-group { margin-bottom: 12px; }
        label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; }

        /* Responsif: Kolom bertumpuk di layar kecil */
        .row-inputs { display: flex; flex-direction: column; gap: 10px; }
        @media (min-width: 600px) {
            .row-inputs { flex-direction: row; }
            .row-inputs .form-group { flex: 1; }
        }

        /* Tombol */
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 5px; transition: 0.2s; }
        .save-btn { background: #007bff; color: white; }
        .cancel-btn { background: #6c757d; color: white; display: none; }

        /* Preview Background Form */
        .bg-management-box { border: 1px solid #ddd; padding: 12px; border-radius: 8px; background: #fafafa; margin: 15px 0; }
        .preview { width: 100%; height: 120px; background-size: cover; background-position: center; border-radius: 6px; margin-top: 10px; border: 1px dashed #ccc; background-color: #eee; }

        /* Tabel Responsif dengan Scroll */
        .table-container { width: 100%; overflow-x: auto; margin-top: 20px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; min-width: 650px; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #eee; padding: 10px 8px; text-align: center; vertical-align: middle; }
        th { background-color: #f8f9fa; }
        
        .action-btn { padding: 6px 10px; font-size: 11px; margin: 2px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .edit { background: #ffc107; color: #000; }
        .delete { background: #dc3545; color: white; }
        .bg-pasang { background: #17a2b8; color: white; }
        .bg-hapus { background: #6c757d; color: white; }

        /* MODAL GALERI THEME / BACKGROUND */
        #themeModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .theme-modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .gallery-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background: #f8f9fa;
            text-align: center;
            padding: 8px;
        }
        .gallery-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ccc;
        }
        .gallery-img:hover { opacity: 0.8; }
    </style>
</head>

<body>

<div class="container">
    <!-- TOMBOL MENU THEME KHUSUS -->
    <div class="top-nav">
        <button class="theme-menu-btn" onclick="bukaModalTheme()">🎨 Theme / Kelola Background</button>
    </div>

    <h2>Admin Panel</h2>

    <!-- FORM UTAMA DOKUMEN / TEKS UJIAN -->
    <div class="form-group">
        <label>Link Google Form</label>
        <input type="text" id="formLink" placeholder="Link Form...">
    </div>

    <div class="form-group">
        <label>Token Ujian</label>
        <input type="text" id="token" placeholder="Contoh: uas2026">
    </div>

    <div class="row-inputs">
        <div class="form-group">
            <label>Mata Pelajaran</label>
            <input type="text" id="mapel" placeholder="Nama Mapel">
        </div>
        <div class="form-group">
            <label>Durasi (Menit)</label>
            <input type="number" id="durasi" placeholder="Contoh: 90">
        </div>
    </div>

    <!-- WIDGET PICKER FILE BACKGROUND -->
    <div class="bg-management-box">
        <label>Pilih File Background (Untuk Diunggah / Diganti via Tabel)</label>
        <input type="file" id="bgFile" accept="image/*">
        <div class="preview" id="preview"></div>
    </div>

    <button class="save-btn" id="btnSimpan" onclick="simpanDataTeks()">Simpan Data Baru</button>
    <button class="cancel-btn" id="btnBatal" onclick="resetForm()">Batal</button>

    <h3>Data Ujian Aktif</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Mapel</th>
                    <th>Durasi</th>
                    <th>Token</th>
                    <th>Link</th>
                    <th>Background</th>
                    <th>Aksi Teks</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6">Memuat database...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL HALAMAN THEME / GALERI BACKGROUND -->
<div id="themeModal">
    <div class="theme-modal-content">
        <h3 style="color: #6f42c1; margin-bottom: 5px;">Galeri Background (Theme Manager)</h3>
        <p style="font-size: 12px; color: #666; text-align: center; margin-top: 0;">Pilih salah satu gambar background yang tersedia di bawah ini untuk dipasang ke baris ujian tertentu.</p>
        <hr style="border:0; border-top:1px solid #eee; margin: 15px 0;">
        
        <div id="galleryContainer" class="gallery-grid">
            <p style="grid-column: 1 / -1; text-align: center; color: #666;">Memuat galeri background...</p>
        </div>

        <hr style="border:0; border-top:1px solid #eee; margin: 20px 0 15px 0;">
        <button onclick="tutupModalTheme()" style="background: #6c757d; width: 100%;">Tutup Galeri</button>
    </div>
</div>

<script>
// URL Web App Google Apps Script
const API_URL = "https://script.google.com/macros/s/AKfycbygo9uVEhnY6M8QefD7HEQV57DWTZOE3ACPQhl6b80lvzxGuliQULaE5yKG_guqoDdyPQ/exec";

let base64Image = "";
let editRow = null;
let globalDataList = []; // Menyimpan data konfigurasi aktif untuk galeri theme

// ================= AMBIL DATA UTAMA DARI SERVER =================
async function loadData() {
    const tableBody = document.getElementById("tableBody");
    if (!tableBody) return;
    
    try {
        const res = await fetch(`${API_URL}?action=all`);
        const data = await res.json();

        if (data.error) {
            tableBody.innerHTML = `<tr><td colspan="6" style="color:red;">Error: ${data.error}</td></tr>`;
            return;
        }

        if (data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6">Belum ada data konfigurasi ujian di server.</td></tr>`;
            globalDataList = [];
            return;
        }

        globalDataList = data; // Simpan cache data untuk digunakan di galeri theme
        tableBody.innerHTML = "";

        data.forEach(item => {
            const bgManagementUI = `
                <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
                    ${item.background 
                        ? `<a href="${item.background}" target="_blank"><img src="${item.background}" alt="BG" style="width:42px; height:42px; object-fit:cover; border-radius:4px; border:1px solid #ccc;"></a>` 
                        : `<span style="color:#999; font-style:italic; font-size:11px;">Default</span>`
                    }
                    <div style="display: flex; gap: 3px; margin-top: 2px;">
                        <button class="action-btn bg-pasang" onclick="prosesUploadBgKhusus(${item.row})" title="Pasang/Ganti Background Baris Ini">Pasang BG</button>
                        <button class="action-btn bg-hapus" onclick="hapusBgKhusus(${item.row})" title="Kosongkan Background Baris Ini">Kosongkan BG</button>
                    </div>
                </div>
            `;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${item.mapel}</strong></td>
                <td>${item.durasi} Menit</td>
                <td><code style="background:#eee; padding:2px 6px; border-radius:4px; font-weight:bold;">${item.token}</code></td>
                <td style="font-size:11px; color:#555; max-width:180px; word-break:break-all;">${item.formLink}</td>
                <td>${bgManagementUI}</td>
                <td>
                    <button class="action-btn edit" onclick="masukModeEdit(${item.row}, '${btoa(encodeURIComponent(item.mapel))}', '${btoa(encodeURIComponent(item.durasi))}', '${btoa(encodeURIComponent(item.token))}', '${btoa(encodeURIComponent(item.formLink))}')">Edit Teks</button>
                    <button class="action-btn delete" onclick="hapusBarisTotal(${item.row})">Hapus</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });

    } catch (err) {
        console.error(err);
        tableBody.innerHTML = `<tr><td colspan="6" style="color:red;">Gagal memuat data. Periksa koneksi internet / izin Web App.</td></tr>`;
    }
}

// ================= FUNGSI KONTROL MENU THEME MODAL =================
function bukaModalTheme() {
    const modal = document.getElementById("themeModal");
    modal.style.display = "flex";
    renderGaleriBackground();
}

function tutupModalTheme() {
    const modal = document.getElementById("themeModal");
    modal.style.display = "none";
}

// Render daftar background unik yang sudah diunggah di server
function renderGaleriBackground() {
    const container = document.getElementById("galleryContainer");
    if (!container) return;

    // Filter baris yang memiliki background
    const listBg = globalDataList.filter(item => item.background && item.background.trim() !== "");

    if (listBg.length === 0) {
        container.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #666; font-style: italic;">Belum ada file background tersimpan di server. Silakan unggah background melalui tabel utama terlebih dahulu.</p>`;
        return;
    }

    container.innerHTML = "";
    listBg.forEach(item => {
        const card = document.createElement("div");
        card.className = "gallery-card";
        card.innerHTML = `
            <img src="${item.background}" class="gallery-img" alt="Theme BG" title="Klik untuk pasang ke mapel" onclick="pilihBackgroundKeBaris('${item.background}')">
            <div style="font-size: 11px; font-weight: bold; color: #333; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.mapel}</div>
            <div style="font-size: 10px; color: #777;">Baris ke-${item.row}</div>
        `;
        container.appendChild(card);
    });
}

// Aksi interaktif ketika gambar di galeri theme diklik untuk dipasang ke baris tertentu
async function pilihBackgroundKeBaris(urlBackground) {
    if (globalDataList.length === 0) {
        alert("Tidak ada data baris ujian aktif.");
        return;
    }

    // Buat daftar pilihan baris ujian untuk dipasangi background ini
    let pilihanTeks = "Pilih baris ujian (Mapel) yang ingin dipasangi background ini:\n\n";
    globalDataList.forEach(item => {
        pilihanTeks += `[ Baris ${item.row} ] - ${item.mapel} (Token: ${item.token})\n`;
    });

    let inputRow = prompt(pilihanTeks + "\nMasukkan angka Baris target:");
    if (!inputRow) return;

    let targetRow = parseInt(inputRow.trim());
    const validRow = globalDataList.find(i => i.row === targetRow);

    if (!validRow) {
        alert("Nomor baris tidak valid atau tidak ditemukan di daftar ujian aktif!");
        return;
    }

    if (!confirm(`Pasang background terpilih ke Mapel: ${validRow.mapel} (Baris ${targetRow})?`)) {
        return;
    }

    // Kirim request ke backend untuk menimpa/mengganti background baris target menggunakan URL yang sudah ada
    const payload = {
        action: "upload_bg_url", // Atau gunakan action upload_bg dengan data string URL
        row: targetRow,
        image_url: urlBackground
    };

    // Alternatif jika backend menggunakan action upload_bg berbasis base64, 
    // kita fetch gambar tersebut atau gunakan trik update langsung via kode gs.
    // Agar lebih kompatibel dengan handler backend yang ada, kita update lewat set value langsung atau fetch ulang:
    
    try {
        // Karena backend sudah memiliki handler upload_bg via string base64, 
        // kita bisa langsung mengirim perintah khusus atau memanfaatkan endpoint update string kolom F.
        // Mari kita buat penyesuaian sederhana dengan mengirim fetch update kolom F langsung via action khusus atau tambahkan di gs jika perlu, 
        // atau gunakan fungsi upload_bg dengan mengambil data base64 via canvas (jika gambar dapat di-fetch).
        
        // Cara paling aman & instan tanpa ubah backend gs: Ambil gambar dari URL, convert ke base64 secara lokal, lalu kirim ke action upload_bg!
        const base64Converted = await getBase64FromImageUrl(urlBackground);
        
        const responsePayload = {
            action: "upload_bg",
            row: targetRow,
            image: base64Converted
        };

        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(responsePayload)
        });

        const result = await res.text();
        if (result.includes("SUCCESS")) {
            alert(`Berhasil memasang background ke ${validRow.mapel} (Baris ${targetRow})!`);
            tutupModalTheme();
            loadData();
        } else {
            alert("Gagal memperbarui background: " + result);
        }

    } catch (err) {
        console.error(err);
        alert("Gagal memproses gambar background dari server.");
    }
}

// Helper utility untuk convert URL gambar galeri ke base64 (agar kompatibel penuh dengan fungsi backend upload_bg)
async function getBase64FromImageUrl(url) {
    const data = await fetch(url);
    const blob = await data.blob();
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

// ================= PREVIEW & AUTO COMPRESS GAMBAR (LOKAL) =================
document.getElementById("bgFile").addEventListener("change", function(e){
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event){
        const img = new Image();
        img.onload = function() {
            const MAX_WIDTH = 1280;
            const MAX_HEIGHT = 1280;
            let width = img.width;
            let height = img.height;

            if (width > height) {
                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
            } else {
                if (height > MAX_HEIGHT) {
                    width *= MAX_HEIGHT / height;
                    height = MAX_HEIGHT;
                }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            base64Image = canvas.toDataURL("image/jpeg", 0.75); 
            
            document.getElementById("preview").style.backgroundImage = `url(${base64Image})`;
            console.log("Gambar berhasil dikompresi untuk kestabilan upload.");
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

// ================= SIMPAN / UPDATE TEKS DATA MURNI =================
async function simpanDataTeks() {
    const formLink = document.getElementById("formLink").value.trim();
    const token = document.getElementById("token").value.trim();
    const mapel = document.getElementById("mapel").value.trim();
    const durasi = document.getElementById("durasi").value.trim();

    if (!formLink || !token || !mapel || !durasi) {
        alert("Mohon lengkapi semua bidang data teks terlebih dahulu!");
        return;
    }

    const btnSimpan = document.getElementById("btnSimpan");
    btnSimpan.disabled = true;
    btnSimpan.innerText = "Memproses...";

    const payload = {
        action: editRow ? "update_text" : "add",
        formLink: formLink,
        token: token,
        mapel: mapel,
        durasi: durasi,
        image: editRow ? "" : base64Image
    };
    
    if (editRow) {
        payload.row = editRow;
    }

    try {
        const res = await fetch(API_URL, { 
            method: "POST", 
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload) 
        });
        const result = await res.text();

        if (result.includes("SUCCESS")) {
            alert(editRow ? "Data teks berhasil diperbarui!" : "Konfigurasi ujian baru berhasil disimpan!");
            resetForm();
            loadData();
        } else {
            alert("Respon Server: " + result);
        }
    } catch (err) {
        console.error(err);
        alert("Terjadi gangguan jaringan saat menyimpan data.");
    } finally {
        btnSimpan.disabled = false;
        btnSimpan.innerText = editRow ? "Update Teks Data" : "Simpan Data Baru";
    }
}

// ================= MASUK MODE EDIT TEKS DATA =================
function masukModeEdit(row, mapelB64, durasiB64, tokenB64, formLinkB64) {
    editRow = row;
    
    document.getElementById("mapel").value = decodeURIComponent(atob(mapelB64));
    document.getElementById("durasi").value = decodeURIComponent(atob(durasiB64));
    document.getElementById("token").value = decodeURIComponent(atob(tokenB64));
    document.getElementById("formLink").value = decodeURIComponent(atob(formLinkB64));

    const btnSimpan = document.getElementById("btnSimpan");
    btnSimpan.innerText = "Update Teks Data (Baris " + row + ")";
    btnSimpan.style.background = "#ffc107";
    btnSimpan.style.color = "black";
    
    document.getElementById("btnBatal").style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ================= LOGIKA KHUSUS: UPLOAD/UPDATE BACKGROUND BARIS SPESIFIK =================
async function prosesUploadBgKhusus(row) {
    try {
        if (!row || isNaN(row)) {
            alert("Row tidak valid!");
            return;
        }

        if (!base64Image || typeof base64Image !== "string") {
            alert("Silakan pilih file gambar terlebih dahulu melalui bidang 'Pilih File Background'!");
            return;
        }

        const sizeKB = Math.round((base64Image.length * 3) / 4 / 1024);
        if (sizeKB > 2048) {
            alert("Ukuran gambar terlalu besar! Maksimal 2MB.");
            return;
        }

        if (!confirm(`Apakah Anda yakin ingin memasang background ini untuk baris ${row}?`)) {
            return;
        }

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 60000);

        const payload = {
            action: "upload_bg",
            row: row,
            image: base64Image
        };

        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
            signal: controller.signal
        });

        clearTimeout(timeout);

        const textResult = await res.text();
        console.log("SERVER RESPONSE:", textResult);

        if (!res.ok) {
            throw new Error(textResult || "Server error");
        }

        if (textResult.includes("SUCCESS")) {
            alert(`Sukses mengunggah background untuk baris ${row}!`);
            
            base64Image = "";
            const fileInput = document.getElementById("bgFile");
            if (fileInput) fileInput.value = "";
            const preview = document.getElementById("preview");
            if (preview) preview.style.backgroundImage = "";

            loadData();
        } else {
            alert("Gagal upload. Respon server: " + textResult);
        }

    } catch (err) {
        console.error("UPLOAD ERROR:", err);
        if (err.name === "AbortError") {
            alert("Upload timeout! Server Google Apps Script memakan waktu terlalu lama (lebih dari 60 detik).");
        } else {
            alert("Terjadi kesalahan jaringan atau server gagal merespon.");
        }
    }
}

// ================= LOGIKA KHUSUS: KOSONGKAN BACKGROUND BARIS SPESIFIK =================
async function hapusBgKhusus(row) {
    if (!confirm(`Apakah Anda yakin ingin menghapus background pada baris ${row} dan mengembalikannya ke default?`)) return;

    const payload = { action: "delete_bg", row: row };

    try {
        const res = await fetch(API_URL, { 
            method: "POST", 
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload) 
        });
        const result = await res.text();
        
        if (result.includes("SUCCESS")) {
            alert("Background berhasil dikembalikan ke default!");
            loadData();
        } else {
            alert("Gagal: " + result);
        }
    } catch (err) {
        console.error(err);
        alert("Gagal terhubung dengan server cloud.");
    }
}

// ================= TOTAL HAPUS BARIS DATA =================
async function hapusBarisTotal(row) {
    if (!confirm(`PERINGATAN: Menghapus baris data ${row} secara total? File gambar terikat juga akan dibersihkan otomatis.`)) return;

    const payload = { action: "delete", row: row };

    try {
        const res = await fetch(API_URL, { 
            method: "POST", 
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload) 
        });
        const result = await res.text();
        
        if (result.includes("SUCCESS")) {
            alert("Seluruh data baris berhasil dimusnahkan!");
            if(editRow === row) resetForm();
            loadData();
        } else {
            alert("Gagal: " + result);
        }
    } catch (err) {
        console.error(err);
        alert("Gagal berkomunikasi dengan server.");
    }
}

// ================= RESET / BERSIHKAN FORM INTERFACE =================
function resetForm() {
    document.getElementById("formLink").value = "";
    document.getElementById("token").value = "";
    document.getElementById("mapel").value = "";
    document.getElementById("durasi").value = "";
    document.getElementById("preview").style.backgroundImage = "";
    document.getElementById("bgFile").value = "";
    
    const btnSimpan = document.getElementById("btnSimpan");
    if (btnSimpan) {
        btnSimpan.innerText = "Simpan Data Baru";
        btnSimpan.style.background = "#007bff";
        btnSimpan.style.color = "white";
    }
    document.getElementById("btnBatal").style.display = "none";
    
    base64Image = "";
    editRow = null;
}

// Jalankan otomatis saat halaman dirender admin
loadData();
</script>

</body>
</html>
